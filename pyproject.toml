[project]
name = "cyberqa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Schwarz", email = "151512218+Schwar2@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "datasets>=5.0.1",
    "langgraph>=1.2.11",
    "openai>=3.8.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pypdf>=6.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.15.0",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sentence-transformers>=5.0.0",
    "stix2>=3.0.2",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
